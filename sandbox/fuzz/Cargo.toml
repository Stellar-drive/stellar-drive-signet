[package]
name = "stellar-drive-signet-simulator-fuzz"
description = "cargo-fuzz targets for stellar-drive-signet-simulator (#525): framing, dispatch, xdr_params."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
stellar-drive-signet-simulator = { path = "../simulator" }

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dispatch"
path = "fuzz_targets/dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xdr_params"
path = "fuzz_targets/xdr_params.rs"
test = false
doc = false
bench = false
