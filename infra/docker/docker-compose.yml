services:
  postgres:
    image: postgres:16
    container_name: stellar-drive-signet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellar-drive-signet
      POSTGRES_PASSWORD: stellar-drive-signet
      POSTGRES_DB: stellar-drive-signet
    ports:
      - "5432:5432"
    volumes:
      - stellar-drive-signet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellar-drive-signet -d stellar-drive-signet"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    profiles:
      - indexer
    build:
      context: ../..
      dockerfile: apps/indexer/Dockerfile
    container_name: stellar-drive-signet-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stellar-drive-signet:stellar-drive-signet@postgres:5432/stellar-drive-signet?schema=public
      INDEXER_NETWORK: ${INDEXER_NETWORK:-testnet}
      INDEXER_HORIZON_URL: ${INDEXER_HORIZON_URL:-https://horizon-testnet.stellar.org}
      INDEXER_RPC_URL: ${INDEXER_RPC_URL:-https://soroban-testnet.stellar.org}
      INDEXER_TICK_INTERVAL_MS: ${INDEXER_TICK_INTERVAL_MS:-30000}
      INDEXER_LOG_LEVEL: ${INDEXER_LOG_LEVEL:-info}
      INDEXER_REGISTRY_CONTRACT_ID: ${INDEXER_REGISTRY_CONTRACT_ID:-}
      INDEXER_EVENT_WINDOW_LEDGERS: ${INDEXER_EVENT_WINDOW_LEDGERS:-8000}
      INDEXER_OPERATIONS_RETENTION_DAYS: ${INDEXER_OPERATIONS_RETENTION_DAYS:-90}
      INDEXER_SNAPSHOTS_RETENTION_DAYS: ${INDEXER_SNAPSHOTS_RETENTION_DAYS:-30}
      INDEXER_PRUNE_INTERVAL_MS: ${INDEXER_PRUNE_INTERVAL_MS:-3600000}

volumes:
  stellar-drive-signet-pgdata:
